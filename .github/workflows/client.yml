name: Ionic Client
on:
  push:
    paths: ['apps/ionic/**', 'platforms/linux/**', '.github/workflows/client.yml']
  pull_request:
    paths: ['apps/ionic/**', 'platforms/linux/**', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ionic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ionic/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  android-debug-shell:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ionic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ionic/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android UI shell (VPN plugin is not implemented)
        working-directory: apps/ionic/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-android-ui-shell-debug
          path: apps/ionic/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  arch-desktop-shell:
    needs: web
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Install Arch build dependencies (full rolling update)
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git nodejs npm rust webkit2gtk-4.1 openssl librsvg xdotool desktop-file-utils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test user-local installer in temporary directories
        run: node --test platforms/linux/install.test.mjs
      - run: npm ci
        working-directory: apps/ionic
      - name: Build Arch desktop UI shell (no VPN module)
        working-directory: apps/ionic
        run: npm run desktop:build
      - name: Record architecture and runtime dependencies
        run: |
          uname -m
          file apps/ionic/src-tauri/target/release/aegis-client-desktop
          ldd apps/ionic/src-tauri/target/release/aegis-client-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-arch-x86_64-ui-shell
          path: apps/ionic/src-tauri/target/release/aegis-client-desktop
          if-no-files-found: error
          retention-days: 14
